# ============================================================================
# AWS Amplify Hosting build spec — static export target.
#
# Amplify's managed SSR provider does not support Next.js 16 (as of this
# writing it tops out at 15). That's a non-issue here because we deploy the
# static export instead: it is just files, so no host needs to understand
# which Next.js version produced them.
#
# In the Amplify console set the build output directory to `out`.
# ============================================================================
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # `install` rather than `use`: it's idempotent, and it doesn't assume
        # Amplify's build image happens to ship the version we want today.
        - nvm install 22
        - nvm use 22
        - node --version
        - npm ci
    build:
      commands:
        # next.config.mjs exports a static site by default, so this just works.
        # The Instagram feed is fetched at build time, so a rebuild is what
        # refreshes it — see the nightly workflow in .github/workflows/.
        - npm run build
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*

# Response headers are NOT configured here — a customHeaders block in this
# file is the deprecated location and is silently ignored. See customHttp.yml.
